name: LPChat
version: 1.2.0
author: tobias30
main: de.lpchat.LPChatPlugin
api-version: '26.2'
description: LuckPerms-Praefixe, UltimateTeams, Chatfarben und Attribute-Swapping.
depend: [LuckPerms]
softdepend: [PlaceholderAPI, UltimateTeams]
commands:
  namecolor:
    description: Waehle deine Namensfarbe oder einen Farbverlauf.
    usage: /namecolor [Farbe|gradient [Startfarbe Endfarbe]|flag [Flagge]|reset]
    aliases: [namensfarbe]
    permission: namecolor.use
  chatcolor:
    description: Waehle deine Chatfarbe.
    usage: /chatcolor [Farbe|reset]
    aliases: [chatfarbe]
    permission: chatcolor.use
permissions:
  namecolor.flags:
    description: Pride-Flaggen als Namensfarben verwenden.
    default: true
  namecolor.use:
    description: Namensfarbe auswaehlen.
    default: true
  namecolor.gradient:
    description: Farbverlauf fuer den Namen verwenden.
    default: true
  chatcolor.use:
    description: Oeffnet die Farbauswahl.
    default: true
  chatcolor.*:
    description: Schaltet alle Chatfarben frei.
    default: op
  chatcolor.1:
    default: false
  chatcolor.2:
    default: false
  chatcolor.3:
    default: false
  chatcolor.4:
    default: false
  chatcolor.5:
    default: false
  chatcolor.6:
    default: false
  chatcolor.7:
    default: false
  chatcolor.8:
    default: false
  chatcolor.9:
    default: false
  chatcolor.10:
    default: false
  chatcolor.11:
    default: false
  chatcolor.12:
    default: false
  chatcolor.13:
    default: false
  chatcolor.14:
    default: false
  chatcolor.15:
    default: false
  chatcolor.16:
    default: false
